services:
  postgres:
    image: postgres:17-alpine
    container_name: auth-saas-raes-postgres
    environment:
      POSTGRES_DB: auth_saas
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    volumes:
      - auth_saas_raes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_saas_raes_pg:
